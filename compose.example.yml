name: example-tickets

services:
  example-tickets:
    build: .
    image: example-tickets-mcp:local
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      CONNECTION_TOKEN_FILE: /run/secrets/connection_token
      BACKEND_API_KEY_FILE: /run/secrets/backend_api_key
      TRUST_CALLER_CONTEXT: "false"
      LOG_LEVEL: info
    secrets: [connection_token, backend_api_key]
    # Data the server reads from disk (a file share mounted on the host, see
    # docs/deploying.md): bind-mount each published folder read-only, and
    # publish the container paths, e.g. FILE_ROOTS: "policies=/data/policies".
    # volumes:
    #   - type: bind
    #     source: /mnt/shares/policies
    #     target: /data/policies
    #     read_only: true
    # boneyard-integrations makes the server reachable by the gateway only; it
    # has no egress. Add "backend" only if the server calls out to an API,
    # database or file server. A server that only reads bind-mounted folders
    # needs neither the network nor the backend credential.
    networks: [boneyard-integrations, backend]

secrets:
  connection_token:
    file: ./secrets/connection-token
  backend_api_key:
    file: ./secrets/backend-api-key

networks:
  boneyard-integrations:
    external: true
  backend: {}
